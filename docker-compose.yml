
services:
  ai_service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: pcb_ai_service
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
    restart: unless-stopped

  backend:
    build:
      context: ./node_backend
      dockerfile: Dockerfile
    container_name: pcb_backend
    ports:
      - "5000:5000"
    environment:
      - AI_SERVICE_URL=http://ai_service:8000
      # Read from the .env file next to this compose file (gitignored).
      - MONGO_URI=${MONGO_URI:-}
    depends_on:
      - ai_service
    restart: unless-stopped

  frontend:
    build:
      context: ./pcb_frontend
      dockerfile: Dockerfile
    container_name: pcb_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./pcb_frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
